name: Build Bloodflow APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Retain the debug signing key for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bloodflow-debug-signing-v1
      - name: Assemble debug APK
        env:
          BLOODFLOW_FIREBASE_API_KEY: ${{ secrets.BLOODFLOW_FIREBASE_API_KEY }}
          BLOODFLOW_FIREBASE_APP_ID: ${{ secrets.BLOODFLOW_FIREBASE_APP_ID }}
          BLOODFLOW_FIREBASE_PROJECT_ID: ${{ secrets.BLOODFLOW_FIREBASE_PROJECT_ID }}
          BLOODFLOW_FIREBASE_WEB_CLIENT_ID: ${{ secrets.BLOODFLOW_FIREBASE_WEB_CLIENT_ID }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Show Android signing SHA-1 for Firebase configuration
        run: keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep 'SHA1:'
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Bloodflow-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
